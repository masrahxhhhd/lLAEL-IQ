<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAEL IQ | المنتجات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} body{margin:0;background:#080808;color:#fff;font-family:"Cairo",sans-serif}.sidebar{position:fixed;right:0;top:0;width:270px;height:100vh;background:#111;border-left:1px solid #292929;padding:30px 20px}.logo{text-align:center;margin-bottom:40px}.logo h1{margin:0;color:#d4af37;font-size:34px;font-weight:900;letter-spacing:3px}.logo span{display:block;color:#777;font-size:10px;letter-spacing:1.5px}.admin-label{text-align:center;color:#aaa;font-size:13px;margin-bottom:25px}.menu{display:flex;flex-direction:column;gap:8px}.menu a{display:block;text-decoration:none;color:#aaa;padding:14px 16px;border-radius:10px;font-size:14px;font-weight:700}.menu a:hover,.menu a.active{background:rgba(212,175,55,.1);color:#d4af37}.logout{position:absolute;bottom:25px;right:20px;width:calc(100% - 40px);padding:13px;border:1px solid #542222;background:#1a0c0c;color:#ff7777;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer}.main{margin-right:270px;padding:35px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.top h2{margin:0;font-size:28px}.top p{margin:5px 0 0;color:#777;font-size:13px}.search{width:min(360px,100%);height:45px;background:#111;border:1px solid #333;border-radius:9px;color:#fff;padding:0 14px;outline:none}.search:focus{border-color:#d4af37}.panel{background:#111;border:1px solid #252525;border-radius:16px;padding:25px;overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.add{border:0;background:#d4af37;color:#111;padding:10px 18px;border-radius:8px;font-family:inherit;font-weight:800;cursor:pointer}.table{width:100%;border-collapse:collapse;min-width:850px}.table th{color:#777;font-size:12px;text-align:right;padding:14px 10px;border-bottom:1px solid #292929}.table td{padding:14px 10px;border-bottom:1px solid #202020;font-size:13px}.name{font-weight:800}.muted{color:#777;font-size:11px}.price{color:#d4af37;font-weight:800}.badge{display:inline-block;padding:5px 9px;border-radius:6px;background:rgba(50,180,100,.1);color:#6be09a;font-size:11px}.badge.out{background:rgba(200,50,50,.1);color:#ff7777}.actions{display:flex;gap:7px}.action{border:1px solid #333;background:#171717;color:#aaa;min-width:38px;height:36px;border-radius:7px;cursor:pointer}.action:hover{color:#d4af37;border-color:#d4af37}.empty{text-align:center;padding:60px;color:#777}@media(max-width:700px){.sidebar{position:relative;width:100%;height:auto;border-left:0;border-bottom:1px solid #292929}.logout{position:static;width:100%;margin-top:20px}.main{margin-right:0;padding:20px}.top{align-items:stretch;flex-direction:column}.panel{padding:15px}}
</style>
<link rel="stylesheet" href="../assets/css/glow.css"></head>
<body>
<aside class="sidebar">
<div class="logo"><h1>LAEL IQ</h1><span>FROM IRAQ TO THE WORLD</span></div>
<div class="admin-label">لوحة تحكم الإدارة</div>
<nav class="menu">
<a href="index.html">📊 لوحة التحكم</a>
<a href="products.html">📦 المنتجات</a>
<a href="product.html">➕ إضافة منتج</a>
<a href="categories.html">🗂️ الفئات</a>
<a href="orders.html">🛒 الطلبات</a>
<a href="customers.html">👥 العملاء</a>
<a href="offers.html">🏷️ العروض والخصومات</a>
<a href="inventory.html">📊 المخزون</a>
<a href="settings.html">⚙️ الإعدادات</a>
<a href="../public/index.html">🏪 المتجر</a>
</nav>
<button class="logout" id="logoutButton">تسجيل الخروج</button>
</aside>
<main class="main">
<div class="top"><div><h2>المنتجات</h2><p>إدارة وتعديل المنتجات المضافة إلى متجر LAEL IQ</p></div><input id="productSearch" class="search" placeholder="ابحث باسم المنتج أو الماركة..."></div>
<section class="panel"><div class="toolbar"><h3>كل المنتجات</h3><button class="add" onclick="location.href='product.html'">+ إضافة منتج</button></div><table class="table"><thead><tr><th>المنتج</th><th>السعر</th><th>المخزون</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody id="productsTable"></tbody></table></section>
</main>
<script>
if(sessionStorage.getItem("laelAdminLoggedIn")!=="true") location.replace("login.html");
const table=document.getElementById("productsTable"), search=document.getElementById("productSearch");
function products(){try{const p=JSON.parse(localStorage.getItem("laelProducts")||"[]");return Array.isArray(p)?p:[]}catch(e){return[]}}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
function render(){const q=(search.value||"").trim().toLowerCase();const list=products().filter(p=>`${p.name||""} ${p.brand||""} ${p.category||""}`.toLowerCase().includes(q));table.innerHTML="";if(!list.length){table.innerHTML=`<tr><td colspan="5" class="empty">لا توجد منتجات مطابقة.<br><br><button class="add" onclick="location.href='product.html'">+ إضافة منتج</button></td></tr>`;return}list.forEach(p=>{const realIndex=products().findIndex(x=>x.id===p.id);let status=p.status==="out"?"غير متوفر":p.status==="limited"?"كمية محدودة":"متوفر";table.innerHTML+=`<tr><td><div class="name">${esc(p.name)}</div><div class="muted">${esc(p.brand||p.category||"LAEL IQ")}</div></td><td class="price">${Number(p.price||0).toLocaleString("en-US")} IQD</td><td>${Number(p.stock||0).toLocaleString("en-US")}</td><td><span class="badge ${p.status==="out"?"out":""}">${status}</span></td><td><div class="actions"><button class="action" title="تعديل" onclick="edit(${realIndex})">✏️</button><button class="action" title="حذف" onclick="removeProduct(${realIndex})">🗑</button></div></td></tr>`})}
function edit(i){const p=products()[i];if(!p)return;localStorage.setItem("laelEditProductId",p.id);location.href="product.html?edit="+encodeURIComponent(p.id)}
function removeProduct(i){if(!confirm("هل أنت متأكد من حذف هذا المنتج؟"))return;const p=products();p.splice(i,1);localStorage.setItem("laelProducts",JSON.stringify(p));render()}
document.getElementById("logoutButton").addEventListener("click",()=>{sessionStorage.removeItem("laelAdminLoggedIn");location.replace("login.html")});search.addEventListener("input",render);render();
</script>
</body>
</html>

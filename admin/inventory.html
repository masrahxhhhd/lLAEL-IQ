<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LAEL IQ | المخزون</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:"Cairo",sans-serif}.sidebar{position:fixed;right:0;top:0;width:270px;height:100vh;background:#111;border-left:1px solid #292929;padding:30px 20px;z-index:10}.logo{text-align:center;margin-bottom:40px}.logo h1{margin:0;color:#d4af37;font-size:34px;font-weight:900;letter-spacing:3px}.logo span{display:block;color:#777;font-size:10px;letter-spacing:1.5px}.admin-label{text-align:center;color:#aaa;font-size:13px;margin-bottom:25px}.menu{display:flex;flex-direction:column;gap:8px}.menu a{display:block;text-decoration:none;color:#aaa;padding:12px 14px;border-radius:10px;font-size:13px;font-weight:700}.menu a:hover,.menu a.active{background:rgba(212,175,55,.1);color:#d4af37}.logout{position:absolute;bottom:25px;right:20px;width:calc(100% - 40px);padding:13px;border:1px solid #542222;background:#1a0c0c;color:#ff7777;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer}.main{margin-right:270px;padding:35px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.top h2{margin:0;font-size:28px}.top p{margin:5px 0 0;color:#777;font-size:13px}.panel{background:#111;border:1px solid #252525;border-radius:16px;padding:25px;margin-bottom:20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.search,.field input,.field select{height:45px;background:#0b0b0b;border:1px solid #333;border-radius:9px;color:#fff;padding:0 14px;outline:none;font-family:inherit}.search{width:min(390px,100%)}.search:focus,.field input:focus,.field select:focus{border-color:#d4af37}.table{width:100%;border-collapse:collapse;min-width:850px}.table th{color:#777;font-size:12px;text-align:right;padding:14px 10px;border-bottom:1px solid #292929}.table td{padding:14px 10px;border-bottom:1px solid #202020;font-size:13px}.name{font-weight:800}.muted{color:#777;font-size:11px}.gold{color:#d4af37;font-weight:800}.badge{display:inline-block;padding:5px 9px;border-radius:6px;background:rgba(50,180,100,.1);color:#6be09a;font-size:11px}.badge.out{background:rgba(200,50,50,.1);color:#ff7777}.badge.warn{background:rgba(212,175,55,.1);color:#d4af37}.actions{display:flex;gap:7px}.action{border:1px solid #333;background:#171717;color:#aaa;min-width:38px;height:36px;border-radius:7px;cursor:pointer}.action:hover{color:#d4af37;border-color:#d4af37}.empty{text-align:center;padding:60px;color:#777}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.mini{background:#111;border:1px solid #252525;border-radius:14px;padding:20px}.mini small{color:#777}.mini strong{display:block;margin-top:7px;color:#d4af37;font-size:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label{font-size:12px;color:#bbb;font-weight:700}.field input,.field select{width:100%}.btn{border:0;background:#d4af37;color:#111;padding:11px 18px;border-radius:9px;font-family:inherit;font-weight:900;cursor:pointer}.btn.dark{background:#171717;color:#bbb;border:1px solid #333}.btn.red{background:#2a1111;color:#ff8b8b;border:1px solid #542222}.notice{padding:12px 14px;border-radius:9px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);color:#d4af37;font-size:12px;margin-top:10px}.customer-card{background:#0b0b0b;border:1px solid #292929;border-radius:12px;padding:16px;margin-bottom:12px}.customer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.customer-grid small{display:block;color:#777;font-size:10px}.customer-grid strong{display:block;margin-top:4px;font-size:13px}.stock-low{color:#d4af37}.stock-out{color:#ff7777}.stock-ok{color:#6be09a}@media(max-width:1000px){.sidebar{width:220px}.main{margin-right:220px}.cards{grid-template-columns:repeat(2,1fr)}.customer-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.sidebar{position:relative;width:100%;height:auto;border-left:0;border-bottom:1px solid #292929}.logout{position:static;width:100%;margin-top:20px}.main{margin-right:0;padding:20px}.top{flex-direction:column;align-items:stretch}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.customer-grid{grid-template-columns:1fr}.panel{overflow-x:auto}.table{min-width:850px}}</style><link rel="stylesheet" href="../assets/css/glow.css"></head><body><aside class="sidebar"><div class="logo"><h1>LAEL IQ</h1><span>FROM IRAQ TO THE WORLD</span></div><div class="admin-label">لوحة تحكم الإدارة</div><nav class="menu"><nav class="menu">

</nav></nav><button class="logout" id="logoutButton">تسجيل الخروج</button></aside><main class="main"><div class="top"><div><h2>المخزون</h2><p>مراقبة الكميات وتعديل المخزون بسرعة</p></div><input id="search" class="search" placeholder="ابحث عن منتج..."></div><div class="cards"><div class="mini"><small>كل المنتجات</small><strong id="all">0</strong></div><div class="mini"><small>متوفر</small><strong id="ok">0</strong></div><div class="mini"><small>كمية محدودة</small><strong id="low">0</strong></div><div class="mini"><small>نفد</small><strong id="out">0</strong></div></div><section class="panel" style="margin-top:20px"><table class="table"><thead><tr><th>المنتج</th><th>المخزون</th><th>الحالة</th><th>تعديل سريع</th></tr></thead><tbody id="list"></tbody></table></section></main><script>const KEY="laelProducts";if(sessionStorage.getItem("laelAdminLoggedIn")!=="true")location.replace("login.html");const read=()=>{try{const x=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}},save=x=>localStorage.setItem(KEY,JSON.stringify(x)),esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");function status(p){const n=Number(p.stock)||0;return n<=0?["غير متوفر","out"]:n<=3?["كمية محدودة","warn"]:["متوفر",""]}function render(){const all=read(),q=(document.getElementById("search").value||"").trim().toLowerCase();document.getElementById("all").textContent=all.length;document.getElementById("ok").textContent=all.filter(p=>(Number(p.stock)||0)>3).length;document.getElementById("low").textContent=all.filter(p=>(Number(p.stock)||0)>0&&(Number(p.stock)||0)<=3).length;document.getElementById("out").textContent=all.filter(p=>(Number(p.stock)||0)<=0).length;const list=document.getElementById("list");const filtered=all.filter(p=>`${p.name||""} ${p.brand||""}`.toLowerCase().includes(q));list.innerHTML=filtered.length?filtered.map(p=>{const [txt,cls]=status(p),i=all.findIndex(x=>x.id===p.id);return `<tr><td><div class="name">${esc(p.name)}</div><div class="muted">${esc(p.brand||p.category||"")}</div></td><td class="gold">${Number(p.stock)||0}</td><td><span class="badge ${cls}">${txt}</span></td><td><div class="actions"><button class="action" onclick="change(${i},-1)">−</button><button class="action" onclick="change(${i},1)">+</button><button class="action" onclick="change(${i},5)">+5</button><button class="action" onclick="change(${i},-5)">−5</button></div></td></tr>`}).join(""): '<tr><td colspan="4" class="empty">لا توجد منتجات</td></tr>'}function change(i,n){const p=read();if(!p[i])return;p[i].stock=Math.max(0,(Number(p[i].stock)||0)+n);p[i].status=p[i].stock<=0?"out":p[i].stock<=3?"limited":"available";p[i].updatedAt=new Date().toISOString();save(p);render()}document.getElementById("logoutButton").onclick=()=>{sessionStorage.removeItem("laelAdminLoggedIn");location.replace("login.html")};document.getElementById("search").oninput=render;addEventListener("storage",render);render();</script></body></html>

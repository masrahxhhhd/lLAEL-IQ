<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LAEL IQ | العروض والخصومات</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:"Cairo",sans-serif}.sidebar{position:fixed;right:0;top:0;width:270px;height:100vh;background:#111;border-left:1px solid #292929;padding:30px 20px;z-index:10}.logo{text-align:center;margin-bottom:40px}.logo h1{margin:0;color:#d4af37;font-size:34px;font-weight:900;letter-spacing:3px}.logo span{display:block;color:#777;font-size:10px;letter-spacing:1.5px}.admin-label{text-align:center;color:#aaa;font-size:13px;margin-bottom:25px}.menu{display:flex;flex-direction:column;gap:8px}.menu a{display:block;text-decoration:none;color:#aaa;padding:12px 14px;border-radius:10px;font-size:13px;font-weight:700}.menu a:hover,.menu a.active{background:rgba(212,175,55,.1);color:#d4af37}.logout{position:absolute;bottom:25px;right:20px;width:calc(100% - 40px);padding:13px;border:1px solid #542222;background:#1a0c0c;color:#ff7777;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer}.main{margin-right:270px;padding:35px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.top h2{margin:0;font-size:28px}.top p{margin:5px 0 0;color:#777;font-size:13px}.panel{background:#111;border:1px solid #252525;border-radius:16px;padding:25px;margin-bottom:20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.search,.field input,.field select{height:45px;background:#0b0b0b;border:1px solid #333;border-radius:9px;color:#fff;padding:0 14px;outline:none;font-family:inherit}.search{width:min(390px,100%)}.search:focus,.field input:focus,.field select:focus{border-color:#d4af37}.table{width:100%;border-collapse:collapse;min-width:850px}.table th{color:#777;font-size:12px;text-align:right;padding:14px 10px;border-bottom:1px solid #292929}.table td{padding:14px 10px;border-bottom:1px solid #202020;font-size:13px}.name{font-weight:800}.muted{color:#777;font-size:11px}.gold{color:#d4af37;font-weight:800}.badge{display:inline-block;padding:5px 9px;border-radius:6px;background:rgba(50,180,100,.1);color:#6be09a;font-size:11px}.badge.out{background:rgba(200,50,50,.1);color:#ff7777}.badge.warn{background:rgba(212,175,55,.1);color:#d4af37}.actions{display:flex;gap:7px}.action{border:1px solid #333;background:#171717;color:#aaa;min-width:38px;height:36px;border-radius:7px;cursor:pointer}.action:hover{color:#d4af37;border-color:#d4af37}.empty{text-align:center;padding:60px;color:#777}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.mini{background:#111;border:1px solid #252525;border-radius:14px;padding:20px}.mini small{color:#777}.mini strong{display:block;margin-top:7px;color:#d4af37;font-size:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label{font-size:12px;color:#bbb;font-weight:700}.field input,.field select{width:100%}.btn{border:0;background:#d4af37;color:#111;padding:11px 18px;border-radius:9px;font-family:inherit;font-weight:900;cursor:pointer}.btn.dark{background:#171717;color:#bbb;border:1px solid #333}.btn.red{background:#2a1111;color:#ff8b8b;border:1px solid #542222}.notice{padding:12px 14px;border-radius:9px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);color:#d4af37;font-size:12px;margin-top:10px}.customer-card{background:#0b0b0b;border:1px solid #292929;border-radius:12px;padding:16px;margin-bottom:12px}.customer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.customer-grid small{display:block;color:#777;font-size:10px}.customer-grid strong{display:block;margin-top:4px;font-size:13px}.stock-low{color:#d4af37}.stock-out{color:#ff7777}.stock-ok{color:#6be09a}@media(max-width:1000px){.sidebar{width:220px}.main{margin-right:220px}.cards{grid-template-columns:repeat(2,1fr)}.customer-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.sidebar{position:relative;width:100%;height:auto;border-left:0;border-bottom:1px solid #292929}.logout{position:static;width:100%;margin-top:20px}.main{margin-right:0;padding:20px}.top{flex-direction:column;align-items:stretch}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.customer-grid{grid-template-columns:1fr}.panel{overflow-x:auto}.table{min-width:850px}}</style><link rel="stylesheet" href="../assets/css/glow.css"></head><body><aside class="sidebar"><div class="logo"><h1>LAEL IQ</h1><span>FROM IRAQ TO THE WORLD</span></div><div class="admin-label">لوحة تحكم الإدارة</div><nav class="menu"><nav class="menu">

</nav></nav><button class="logout" id="logoutButton">تسجيل الخروج</button></aside><main class="main"><div class="top"><div><h2>العروض والخصومات</h2><p>إدارة الخصومات والمنتجات المميزة والجديدة</p></div><input id="search" class="search" placeholder="ابحث عن منتج..."></div><section class="panel"><table class="table"><thead><tr><th>المنتج</th><th>السعر</th><th>السعر السابق</th><th>الخصم</th><th>مميز</th><th>جديد</th><th>إجراء</th></tr></thead><tbody id="list"></tbody></table></section></main><script>const KEY="laelProducts";if(sessionStorage.getItem("laelAdminLoggedIn")!=="true")location.replace("login.html");const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}},save=x=>localStorage.setItem(KEY,JSON.stringify(x)),esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");function money(v){return (Number(v)||0).toLocaleString("en-US")+" IQD"}function render(){const a=read(),q=(document.getElementById("search").value||"").trim().toLowerCase(),l=document.getElementById("list"),f=a.filter(p=>`${p.name||""} ${p.brand||""}`.toLowerCase().includes(q));l.innerHTML=f.length?f.map(p=>{const i=a.findIndex(x=>x.id===p.id);return `<tr><td class="name">${esc(p.name)}</td><td class="gold">${money(p.price)}</td><td>${p.oldPrice?money(p.oldPrice):"—"}</td><td><span class="badge ${p.isDiscount?"":"out"}">${p.isDiscount?"فعال":"غير فعال"}</span></td><td>${p.isFeatured?"⭐":"—"}</td><td>${p.isNew?"🆕":"—"}</td><td><button class="action" onclick="toggle(${i})">✏️</button></td></tr>`}).join(""): '<tr><td colspan="7" class="empty">لا توجد منتجات</td></tr>'}function toggle(i){const a=read();if(!a[i])return;const p=a[i];const discount=prompt("السعر الحالي (IQD):",p.price);if(discount===null)return;const old=prompt("السعر قبل الخصم (IQD) — اتركه 0 لإلغاء الخصم:",p.oldPrice||0);if(old===null)return;p.price=Math.max(0,Number(discount)||0);p.oldPrice=Math.max(0,Number(old)||0);p.isDiscount=p.oldPrice>p.price&&p.price>0;p.updatedAt=new Date().toISOString();save(a);render()}document.getElementById("logoutButton").onclick=()=>{sessionStorage.removeItem("laelAdminLoggedIn");location.replace("login.html")};document.getElementById("search").oninput=render;addEventListener("storage",render);render();</script></body></html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LAEL IQ | Admin Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#292319,#080808 55%,#030303);
    color:#fff;
    font-family:"Cairo",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:#111;
    border:1px solid rgba(212,175,55,.35);
    border-radius:20px;
    padding:40px 30px;
    text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,.6);
}

.logo{
    color:#d4af37;
    font-size:40px;
    font-weight:900;
    letter-spacing:3px;
}

.subtitle{
    color:#777;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:35px;
}

h2{
    margin:0 0 8px;
}

.description{
    color:#777;
    font-size:13px;
    margin-bottom:25px;
}

label{
    display:block;
    text-align:right;
    color:#ccc;
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
}

input{
    width:100%;
    height:52px;
    background:#080808;
    border:1px solid #333;
    border-radius:9px;
    color:#fff;
    padding:0 15px;
    font-family:inherit;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#d4af37;
}

button{
    width:100%;
    height:52px;
    margin-top:18px;
    border:0;
    border-radius:9px;
    background:#d4af37;
    color:#111;
    font-family:inherit;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
}

.error{
    display:none;
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    color:#ff7777;
    background:rgba(180,30,30,.1);
    border:1px solid rgba(220,70,70,.25);
}

.back{
    display:block;
    margin-top:20px;
    color:#777;
    text-decoration:none;
    font-size:12px;
}
</style>
<link rel="stylesheet" href="../assets/css/glow.css"></head>

<body>

<div class="login-box">

    <div class="logo">LAEL IQ</div>

    <div class="subtitle">
        FROM IRAQ TO THE WORLD
    </div>

    <h2>لوحة تحكم الإدارة</h2>

    <div class="description">
        هذه المنطقة مخصصة لإدارة متجر LAEL IQ
    </div>

    <form id="loginForm">

        <label for="code">
            رمز الإدارة
        </label>

        <input
            id="code"
            type="password"
            placeholder="أدخل رمز الإدارة"
            autocomplete="off"
            required
        >

        <button type="submit">
            دخول لوحة الإدارة
        </button>

    </form>

    <div class="error" id="error">
        رمز الإدارة غير صحيح
    </div>

    <a href="../public/index.html" class="back">
        ← العودة إلى المتجر
    </a>

</div>

<script>

const loginForm =
    document.getElementById("loginForm");

const codeInput =
    document.getElementById("code");

const errorBox =
    document.getElementById("error");

loginForm.addEventListener("submit", function(e){

    e.preventDefault();

    const code =
        codeInput.value.trim();

    const savedPassword = localStorage.getItem("laelAdminPassword") || "LAEL-ADMIN";

    if(code === savedPassword){

        sessionStorage.setItem(
            "laelAdminLoggedIn",
            "true"
        );

        location.href = "index.html";

    }else{

        errorBox.style.display = "block";

        codeInput.value = "";

        codeInput.focus();

    }

});

</script>

</body>
</html>
